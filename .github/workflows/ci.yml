name: CI

on:
  push:
    branches:
      - main
      - master
      - next-version-line/**
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run build typecheck
        run: pnpm run typecheck:build

      - name: Run test typecheck
        run: pnpm run typecheck:test

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit, integration, and e2e tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package build
        run: pnpm run build

      - name: Verify build artifacts
        run: |
          PKG=packages/document-context
          test -d $PKG/build
          test -f $PKG/build/index.js
          test -f $PKG/build/index.d.ts
          test -f $PKG/build/domain/index.js
          test -f $PKG/build/domain/index.d.ts
          test -f $PKG/build/application/index.js
          test -f $PKG/build/application/index.d.ts
          test -f $PKG/build/infrastructure/dom/index.js
          test -f $PKG/build/infrastructure/dom/index.d.ts
          test -f $PKG/build/infrastructure/ssr/index.js
          test -f $PKG/build/infrastructure/ssr/index.d.ts
          test ! -e $PKG/build/infrastructure/storage
