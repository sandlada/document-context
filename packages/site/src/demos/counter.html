<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reactive Counter & DOM Recipe</title>
    <link rel="stylesheet" href="./md3-theme.css" />
    <style>
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            padding: 1.25rem 0;
            background-color: var(--md-sys-color-surface-container-high);
            border-radius: var(--md-sys-shape-corner-value-medium);
            margin-bottom: 1.25rem;
        }
        .stat-item { text-align: center; }
        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--md-sys-color-primary);
            font-family: var(--md-sys-typescale-mono-font);
        }
        .stat-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .button-group { display: flex; flex-wrap: wrap; gap: 0.625rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="counter-host">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="val-count">0</div>
                    <div class="stat-label">Current Count</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="val-double">0</div>
                    <div class="stat-label">Double (Derived)</div>
                </div>
            </div>

            <div class="button-group">
                <button class="primary" id="btn-inc">+1</button>
                <button id="btn-dec">−1</button>
                <button id="btn-inc10">+10</button>
                <button id="btn-reset">Reset</button>
                <button id="btn-read">Read Snapshot</button>
                <button class="danger" id="btn-dispose">Dispose Session</button>
            </div>
        </div>

        <div class="log-box">
            <div class="log-header">
                <span>Session Event Log</span>
                <span class="status-badge active" id="session-status">Active</span>
            </div>
            <ul class="log-entries" id="log-list"></ul>
        </div>
    </div>

    <script type="module">
        import {
            createContext,
            dispose,
            mount,
            onMount,
            pipe,
            read,
            subscribe$,
            update,
        } from '@sandlada/document-context'

        const logList = document.getElementById('log-list')
        const statusBadge = document.getElementById('session-status')

        function addLog(message, isEvent = false) {
            const time = new Date().toLocaleTimeString()
            const li = document.createElement('li')
            li.className = isEvent ? 'log-entry event' : 'log-entry'
            li.innerHTML = `[${time}] ${message}`
            logList.prepend(li)
        }

        // Phase 1: Pure immutable blueprint (zero DOM, zero side effects)
        const counterBlueprint = pipe(
            createContext({ count: 0 }),
            onMount(({ session }) => {
                addLog('<strong>Lifecycle onMount:</strong> session initialized', true)
            }),
        )

        // Phase 2: Mount boundary
        const hostElement = document.getElementById('counter-host')
        const session = mount(counterBlueprint)(hostElement)
        await session.ready
        addLog('<strong>session.ready:</strong> container ready for interaction', true)

        // Reactive DOM recipe: state$ stream automatically updates the UI
        subscribe$((state) => {
            document.getElementById('val-count').textContent = String(state.count)
            document.getElementById('val-double').textContent = String(state.count * 2)
            addLog(`State changed: <strong>count = ${state.count}</strong>`)
        })(session)

        // Event handlers executing pure curried session verbs
        document.getElementById('btn-inc').addEventListener('click', () => {
            update((s) => ({ count: s.count + 1 }))(session)
        })

        document.getElementById('btn-dec').addEventListener('click', () => {
            update((s) => ({ count: s.count - 1 }))(session)
        })

        document.getElementById('btn-inc10').addEventListener('click', () => {
            update((s) => ({ count: s.count + 10 }))(session)
        })

        document.getElementById('btn-reset').addEventListener('click', () => {
            update(() => ({ count: 0 }))(session)
        })

        document.getElementById('btn-read').addEventListener('click', () => {
            const current = read((s) => s.count)(session)
            addLog(`read() snapshot returns: <strong>${current}</strong>`)
        })

        document.getElementById('btn-dispose').addEventListener('click', () => {
            dispose(session)
            statusBadge.textContent = 'Disposed'
            statusBadge.className = 'status-badge disposed'
            addLog('Session disposed. Further updates will be safe no-ops.', true)
        })
    </script>
</body>
</html>
